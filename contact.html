<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Cup o' Joe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img class="logo" src="Logo.png" alt="Cup o' Joe Coffee Company Logo">
        <h1>Cup o' Joe</h1>
        <p>Fresh Coffee. Friendly People.</p>
    </header>
    <!--Add Nav Tags Here-->
    <nav class="navigation" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
    <!--Add Main Here-->
    <Main class="content">
        <section class="contact">
            <h2>Contact Us</h2>
            <P>Have questions? Send Cup o' Joe a message.</P>
            <!--Add Form Here!!!!-->
            <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                    <button type="submit">Send Message</button>
            </form>
        </section>
        <footer class="footer"><p>&copy; 2026 Cup o' Joe Coffee Company</p></footer>
    </Main>
</body>
</html>
